security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Configure your user provider when adding authentication.
    # Example (Doctrine entity provider):
    #
    #   providers:
    #       app_user_provider:
    #           entity:
    #               class: App\Domain\Model\User
    #               property: email
    #
    # Example (custom provider, e.g. authenticating against a remote API):
    #
    #   providers:
    #       api_user_provider:
    #           id: App\Infrastructure\Security\ApiUserProvider
    providers:
        in_memory:
            memory: null

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            # Add an authenticator (form_login, custom_authenticators, ...) when wiring auth.
            # Add login_throttling here once a provider is configured.

    access_control:
        - { path: ^/, roles: PUBLIC_ACCESS }
